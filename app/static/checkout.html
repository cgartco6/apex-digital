<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
<div class="container mt-4">
    <h2>Checkout</h2>
    <div id="orderSummary"></div>
    <div class="mt-3">
        <button class="btn btn-primary" id="payStripe">Pay with Stripe</button>
        <button class="btn btn-success" id="payPayfast">Payfast</button>
        <button class="btn btn-warning" id="showEft">Direct EFT</button>
        <button class="btn btn-info" id="payPaypal">PayPal</button>
    </div>
    <div id="eftDetails" style="display:none;" class="mt-3"></div>
    <form id="proofForm" enctype="multipart/form-data" style="display:none;">
        <input type="file" name="file" accept="image/*,application/pdf">
        <input type="hidden" name="user_id" id="userId">
        <input type="hidden" name="amount" id="amount">
        <button type="submit" class="btn btn-warning mt-2">Upload Proof of Payment</button>
    </form>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const orderId = urlParams.get('order_id');
const token = localStorage.getItem('access_token');
let orderTotal = 0;

fetch(`/api/cart/order/${orderId}`, { headers: { 'Authorization': `Bearer ${token}` } })
  .then(r => r.json())
  .then(order => {
      orderTotal = order.total;
      document.getElementById('orderSummary').innerHTML = `<div class="card p-3">Order #${order.id} – Total: R${order.total}</div>`;
  });

document.getElementById('payStripe').onclick = () => {
    fetch('/api/pay/stripe/pay-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ order_id: orderId })
    }).then(r => r.json()).then(data => {
        const stripe = Stripe('pk_test_51...'); // REPLACE with your publishable key
        stripe.confirmPayment({ clientSecret: data.client_secret });
    });
};

document.getElementById('payPayfast').onclick = () => {
    fetch('/api/pay/payfast/redirect', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: orderTotal, user_id: 1 }) // need real user id
    }).then(r => r.json()).then(d => window.location.href = d.redirect_url);
};

document.getElementById('showEft').onclick = () => {
    fetch(`/api/pay/direct-eft/details?user_id=1&amount=${orderTotal}`)
      .then(r => r.json())
      .then(data => {
          let html = `<div class="alert alert-info">
              <p>Bank: ${data.bank_name}</p>
              <p>Account: ${data.account_number}</p>
              <p>Reference: ${data.reference}</p>
              <p>Amount: R${data.amount_due}</p>
          </div>`;
          document.getElementById('eftDetails').innerHTML = html;
          document.getElementById('eftDetails').style.display = 'block';
          document.getElementById('proofForm').style.display = 'block';
          document.getElementById('userId').value = 1;
          document.getElementById('amount').value = orderTotal;
      });
};

document.getElementById('payPaypal').onclick = () => {
    fetch('/api/pay/paypal/create-order', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: orderTotal })
    }).then(r => r.json()).then(d => alert('PayPal order created: ' + d.order_id));
};

document.getElementById('proofForm').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const res = await fetch('/api/pay/direct-eft/upload-proof', { method: 'POST', body: formData });
    const result = await res.json();
    alert(result.message);
};
</script>
</body>
</html>
