<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Shopping Cart</h2>
    <div id="cartItems"></div>
    <div id="cartTotal"></div>
    <button id="checkoutBtn" class="btn btn-success">Proceed to Checkout</button>
</div>
<script>
function loadCart() {
    fetch('/api/cart/get')
      .then(r => r.json())
      .then(data => {
          let itemsHtml = data.items.map(i => `<div class="card mb-2 p-2">${i.name} x ${i.quantity} = R${i.subtotal}</div>`).join('');
          document.getElementById('cartItems').innerHTML = itemsHtml;
          document.getElementById('cartTotal').innerHTML = `<h4>Total: R${data.total}</h4>`;
      });
}
loadCart();
document.getElementById('checkoutBtn').onclick = () => {
    const token = localStorage.getItem('access_token');
    if (!token) { alert('Please login first'); window.location.href='/login'; return; }
    fetch('/api/cart/checkout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } })
      .then(r => r.json())
      .then(data => {
          if (data.order_id) {
              window.location.href = `/checkout?order_id=${data.order_id}`;
          } else {
              alert('Error: ' + data.error);
          }
      });
};
</script>
</body>
</html>
