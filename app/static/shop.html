<!DOCTYPE html>
<html>
<head>
    <title>Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Products</h2>
    <div id="products" class="row"></div>
    <a href="/cart" class="btn btn-primary mt-3">View Cart</a>
</div>
<script>
fetch('/api/cart/products')
  .then(r => r.json())
  .then(products => {
      let html = '';
      products.forEach(p => {
          html += `<div class="col-md-4"><div class="card"><div class="card-body">
              <h5>${p.name}</h5><p>${p.description}</p><p>R${p.price}</p>
              <button class="btn btn-success" onclick="addToCart(${p.id})">Add to Cart</button>
          </div></div></div>`;
      });
      document.getElementById('products').innerHTML = html;
  });
function addToCart(productId) {
    fetch('/api/cart/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ product_id: productId, quantity: 1 })
    }).then(() => alert('Added to cart'));
}
</script>
</body>
</html>
