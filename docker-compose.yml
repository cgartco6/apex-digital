version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apexpass
      POSTGRES_DB: apexdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  web:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://apex:apexpass@db:5432/apexdb
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./static:/static
      - ./uploads:/uploads
volumes:
  db_data:
